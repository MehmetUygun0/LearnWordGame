name: learnwordgame

services:
  db:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: learnwordgame-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_password123}
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_password123}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./Backend/Backend
      dockerfile: Dockerfile
    container_name: learnwordgame-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=${MSSQL_DATABASE:-ProjectLearnWordGame};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_password123};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mobile:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnwordgame-mobile
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:5000}
      EXPO_PUBLIC_API_URL_ANDROID: ${EXPO_PUBLIC_API_URL_ANDROID:-http://10.0.2.2:5000}
      EXPO_PUBLIC_API_URL_IOS: ${EXPO_PUBLIC_API_URL_IOS:-http://localhost:5000}
      EXPO_PUBLIC_API_URL_WEB: ${EXPO_PUBLIC_API_URL_WEB:-http://localhost:5000}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
      CI: "1"
    ports:
      - "${EXPO_PORT:-8081}:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend:/app
      - mobile_node_modules:/app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true
    command: npm run start -- --host lan

volumes:
  sqlvolume:
  mobile_node_modules:
